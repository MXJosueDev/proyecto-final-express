<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | RRHH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="min-h-screen flex items-center justify-center px-6 py-14">
    <div class="w-full max-w-md card rounded-2xl p-8 fade-in">
      <div class="mb-6">
        <p class="text-xs uppercase tracking-[0.2em] text-slate-500">RRHH</p>
        <h1 class="text-3xl font-semibold">Acceso admin</h1>
        <p class="text-slate-600 mt-2">
          Inicia sesion con tu usuario registrado.
        </p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="text-sm text-slate-600">Correo</label>
          <input id="input-mail" type="email" placeholder="admin@empresa.com"
            class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-slate-900"
            required />
        </div>
        <div>
          <label class="text-sm text-slate-600">Contrasena</label>
          <input id="input-password" type="password" placeholder="••••••••"
            class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-slate-900"
            required />
        </div>
        <div id="message" class="text-sm text-slate-700 min-h-[20px]"></div>
        <button class="w-full rounded-xl bg-slate-900 text-white py-2.5 font-medium hover:bg-black transition"
          type="submit">
          Entrar
        </button>
      </form>

      <div class="mt-6 text-sm text-slate-600">
        Los usuarios administradores se crean directo de la base de datos (o desde phpMyAdmin).
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
