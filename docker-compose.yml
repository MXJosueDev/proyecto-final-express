services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "${PORT}:3000"
    depends_on:
      - db
    restart: on-failure
    
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    environment:
      PMA_HOST: ${PMA_HOST}
      PMA_PORT: ${PMA_PORT}
    ports:
      - "${PMA_WEB_PORT}:80"
    depends_on:
      - db
    
  web:
    image: nginx:alpine
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  db_data: 
